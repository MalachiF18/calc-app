<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><link rel="stylesheet" href="/style.css"></head>
<body><main><p class="eyebrow">EVERYDAY ESSENTIALS</p><h1>Calculator</h1><p class="subtitle">A little space to work things out.</p><section class="calculator" aria-label="Calculator"><output aria-label="Result" aria-live="polite">0</output><div class="keys">
<button data-key="clear" class="utility">AC</button><button data-key="sign" class="utility">±</button><button data-key="%" class="utility">%</button><button data-key="/" class="operator">÷</button>
<button>7</button><button>8</button><button>9</button><button data-key="*" class="operator">×</button>
<button>4</button><button>5</button><button>6</button><button data-key="-" class="operator">−</button>
<button>1</button><button>2</button><button>3</button><button data-key="+" class="operator">+</button>
<button class="zero">0</button><button>.</button><button data-key="=" class="equals">=</button>
</div></section><p class="hint">Use your keyboard, too. Enter = solve · Esc = clear</p></main><script type="module" src="/app.js"></script></body></html>
